server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Manifest PWA servi avec le bon type MIME (.webmanifest absent des mime.types par défaut).
    # Les icônes (/icon-*.png) et le branding (/branding/*) sont servis par le bloc « / » ci-dessous.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
